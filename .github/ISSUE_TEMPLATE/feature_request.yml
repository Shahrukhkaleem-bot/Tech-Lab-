name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't a store owner, staff member or shopper do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Include UI sketches or API shape if useful.
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact checklist
      options:
        - label: Needs a database migration
        - label: Changes RLS policies or tenant isolation
        - label: Touches checkout, pricing, stock or payments
        - label: Needs new environment variables / third-party credentials
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
        - [ ] Tests cover …
